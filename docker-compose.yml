services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: almash
      POSTGRES_USER: almash
      POSTGRES_PASSWORD: almash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U almash']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://almash:almash@db:5432/almash?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    depends_on:
      - api
    ports:
      - '5173:80'
volumes:
  postgres_data:
